[package]
name = "volna_core"
version = "2.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
ctr = { version = "0.9", features = ["zeroize"] }
sha2 = "0.10"
jni = { version = "0.21", default-features = false }
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
