plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'app.volna'
 compileSdk 34
 defaultConfig { applicationId 'app.volna'; minSdk 26; targetSdk 34; versionCode 23; versionName '2.7.2'; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libxray_exec.so', '**/libvolna_core.so'] } }
 kotlinOptions { jvmTarget = '1.8' }
}

apply from: rootProject.file('scripts/xray-android.gradle')

tasks.named('preBuild').configure {
 doFirst {
  def arm = file('src/main/jniLibs/armeabi-v7a')
  if (!new File(arm, 'libvolna_core.so').isFile() || !new File(arm, 'libxray_exec.so').isFile()) {
   throw new GradleException('Build ARMv7 libraries with native-core/build-android.sh and scripts/build-xray-armv7.sh.')
  }
 }
}
