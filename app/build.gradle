plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'app.volna'
 compileSdk 34
 defaultConfig { applicationId 'app.volna'; minSdk 26; targetSdk 34; versionCode 21; versionName '2.7.0'; ndk { abiFilters 'arm64-v8a', 'x86_64' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libxray_exec.so', '**/libvolna_core.so'] } }
 kotlinOptions { jvmTarget = '1.8' }
}

apply from: rootProject.file('scripts/xray-android.gradle')
